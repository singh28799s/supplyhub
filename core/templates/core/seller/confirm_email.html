<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Confirm seller email | {{ store_settings.store_name }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  {% include "core/partials/site_theme.html" %}{% include "core/partials/site_theme_styles.html" %}
</head>
<body class="bg-light">
  <main class="container py-5" style="max-width: 560px">
    <section class="card border-0 shadow-sm p-4 p-md-5">
      <h1 class="h3">Confirm your seller email</h1>
      <p class="text-secondary">Continue only if you requested this verification for your SupplyHub seller account.</p>
      <form method="post">
        {% csrf_token %}
        <input type="hidden" name="token" value="{{ token }}">
        <button class="btn btn-success w-100" type="submit">Confirm email address</button>
      </form>
    </section>
  </main>
</body>
</html>
